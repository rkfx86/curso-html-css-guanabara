<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Desafio Mensagens</title>
   <style>
    h1 {
        font-family:Georgia, 'Times New Roman', Times, serif;
        font-weight: lighter;
        text-align: center;
    }

    p {
        font-family: 'Courier New', Courier, monospace;
    }

    main {
        margin: auto;
        min-width: 300px;
        max-width: 1000px;
        box-shadow: 1px 2px 6px rgba(0, 0, 0, 0.568);
        border-radius: 16px;
        padding: 5px;
        text-indent: 2em;
        display: flex;
        flex-direction: column;
    }

    #p1 p, #p2 p {
        margin: 0;
        padding: 0;
    }

    #p1, #p2 {
        margin-bottom: 2em;
    }
   </style>
</head>
<body>
<main>
    
        <h1>Desafio mensagens</h1>
    
       <section id="p1">
           <p>* um</p>
           <p>** dois</p>
           <p>*** três</p>
           <p>**** quatro</p>
       </section>

       <section id="p2">
           <p>**** quatro</p>
           <p>*** três</p>
           <p>** dois</p>
           <p>* um</p>
       </section>

</main>

</body>
</html>
