<!DOCTYPE html>
<html lang="pt-br">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>videos em HTML5</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>Inserindo videos hospedados localmente</h1>
   <p>este video esta sendo hospedado no meu proprio servidor</p>


   <video width="560" poster="imagens/limoes-capa.png" controls loop> 

    <source src="midia/meu-video.mp4" type="video/mp4" >
    <source src="midia/meu-video.m4v" type="video/m4v" >
    <source src="midia/meu-video.webm" type="video/webm" >
    <source src="midia/meu-video.ogv" type="video/ogg" >
    <p>Seu navegador não tem compatibilidade com reprodução de video</p>

   </video>

   <h1>Inserindo video do youtube</h1>
   <iframe width="560" height="315" src="https://www.youtube.com/embed/iTT4YAXGFHQ?si=TfziEAgZI0f3foPo" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

   <h1>inserindo videos do vimeo</h1>
   <iframe title="vimeo-player" src="https://player.vimeo.com/video/12115063?h=a7eb3ed1d3" width="640" height="360" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"   allowfullscreen></iframe>
</body>
</html>
